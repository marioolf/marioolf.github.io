{{- $isAbsoluteHttp := or (hasPrefix .Destination "http://") (hasPrefix .Destination "https://") -}}
{{- $isInternalAbsolute := hasPrefix .Destination .Page.Site.BaseURL -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if and $isAbsoluteHttp (not $isInternalAbsolute) }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
